<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./login.css">
</head>

<body>
    <div class="login-container">
        <h2>Login</h2>
        <form action="" id="login">
            <div class="form-group">
                <label for="username">Username</label><br>
                <input type="text" id="username" name="username" placeholder="Enter Your Username" required><br>
                <span id="unError" class="error-message"></span>
            </div>
            <div class="form-group">
                <label for="password">Password</label><br>
                <input type="password" id="password" name="password" placeholder="Enter Your Password" required><br>
                <span id="pwdError" class="error-message"></span>
            </div>
            <div class="button-group">
                <button class="btn" type="submit">Login</button>

                <a class="btn" href="./register.html">Register</a>
            </div>
            <p id="successMsg"></p>
        </form>
    </div>
    <script>

        let login = document.getElementById("login")
        let un = document.getElementById("username")
        let pwd = document.getElementById("password")

        let unError = document.getElementById("unError")
        let pwdError = document.getElementById("pwdError")

        let successMsg = document.getElementById("successMsg")

        const verify_id = localStorage.getItem("user");
        const user = JSON.parse(verify_id);

        un.addEventListener("change", (e) => {
            e.preventDefault();
            let unObj = {
                userName: e.target.value
            }
            if (verify_id) {
                let match = user.find((u) => u.userName === unObj.userName);
                unError.textContent = match ? "" : "*Invalid username";
            }
        });

        pwd.addEventListener("change", (e) => {
            e.preventDefault();
            let pwdObj = {
                password: e.target.value
            }
            if (verify_id) {
                let match = user.find((u) => u.password === pwdObj.password);
                pwdError.textContent = match ? "" : "*Invalid password";
            }
        });

        login.addEventListener("submit", (e) => {
            e.preventDefault()
            let userobj = {
                userName: un.value,
                password: pwd.value
            };
            if (verify_id) {
                let match = user.find((u) => u.userName === userobj.userName && u.password === userobj.password);
                if (match) {
                    successMsg.textContent = "Logged in successfully ✅"
                    localStorage.setItem("userName", userobj.userName);
                    setTimeout(() => {
                        successMsg.textContent = "";
                        window.location.href = "success.html";
                    }, 1000);
                    un.value = "";
                    pwd.value = "";
                }
            } else {
                successMsg.textContent = "User not registered!";
            }
        });

    </script>
</body>

</html>
