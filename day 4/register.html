<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./register.css">
</head>

<body>
    <div class="cnt">

        <form action="#" method="post">
            <fieldset>
                <legend>Register</legend>
                <div class="main">

                    <div class="uname">
                        <label for="name">Full Name:</label><br>
                        <input type="text" id="name" name="name" required><br><br>
                    </div>
                    <div class="mail">
                        <label for="regEmail">Email:</label><br>
                        <input type="email" id="regEmail" name="email" required><br><br>
                    </div>
                    <div class="pass">
                        <label for="regPassword">Password:</label><br>
                        <input type="password" id="regPassword" name="password" required><br><br>
                    </div>
                    <div class="cpass">
                        <label for="confirmPassword">Confirm Password:</label><br>
                        <input type="password" id="confirmPassword" name="confirm_password" required><br><br>
                    </div>

                </div>
                <div class="btns">
                    <input type="submit" value="Register">
                    <p>already registered?<a href="./login.html">login here</a></p>
                </div>
            </fieldset>
        </form>
    </div>

</body>

</html>
